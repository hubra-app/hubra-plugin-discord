name: Test and release

# Every push and pull request runs the plugin's tests and type check against Hubra.
#
# Publish a release whose tag matches plugin.yaml (v1.3.0 for version 1.3.0), in the
# web UI or with `gh release create v1.3.0 --target main --notes ""`. The workflow runs
# the plugin's tests against Hubra, builds its frontend, signs exactly what is committed
# with the HUBRA_SIGNING_KEY secret (the Hubra project key for official plugins) and
# attaches <id>-<version>.zip to the release. Files listed in .releaseignore stay out of
# the zip. The release description gets that version's CHANGELOG.md section (below
# anything you wrote). The Marketplace (hubra-app/hubra-plugins) picks the release up.
#
# Secrets (organisation or repository):
#   HUBRA_SIGNING_KEY   the private key (PEM) that signs the plugin
#   HUBRA_READ_TOKEN    only while hubra-app/hubra is private: a token that can read it
#   MARKETPLACE_TOKEN   optional: Actions write on the Marketplace repository, so it
#                       publishes right away instead of on its next hourly run
on:
  release:
    types: [published]
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - name: Check the tag against plugin.yaml
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import os, re
          text = open("plugin/plugin.yaml").read()
          pid = re.search(r"^id:\s*[\"']?([\w-]+)", text, re.M).group(1)
          ver = re.search(r"^version:\s*[\"']?([^\"'\s]+)", text, re.M).group(1)
          tag = os.environ["TAG"]
          if tag and tag != f"v{ver}":
              raise SystemExit(f"::error::tag {tag}, but plugin.yaml says version {ver}")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"ID={pid}\nVER={ver}\n")
          PY
      - uses: actions/checkout@v4
        with:
          repository: hubra-app/hubra
          path: hubra
          token: ${{ secrets.HUBRA_READ_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: hubra/app/backend/requirements.lock
      - run: pip install --no-deps -r hubra/app/backend/requirements.lock
      - run: pip install pytest pytest-flask
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hubra/app/frontend/package-lock.json
      - run: npm ci
        working-directory: hubra/app/frontend

      - name: Test against Hubra
        working-directory: hubra/app/backend
        run: |
          rm -rf "../../plugins/$ID" && cp -r "$GITHUB_WORKSPACE/plugin" "../../plugins/$ID"
          (cd ../frontend && npm run typecheck:plugins)
          if [ -d "../../plugins/$ID/tests" ]; then pytest -q "../../plugins/$ID"; fi

      - name: Sign and pack
        if: github.event_name == 'release'
        working-directory: hubra/app/backend
        env:
          FLASK_APP: "hubra:create_app()"
          SIGNING_KEY: ${{ secrets.HUBRA_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then echo "::error::add the HUBRA_SIGNING_KEY secret"; exit 1; fi
          out="$GITHUB_WORKSPACE/build/$ID"
          mkdir -p "$out" && git -C "$GITHUB_WORKSPACE/plugin" archive HEAD | tar -x -C "$out"  # what's committed
          (cd ../frontend && npm run build:plugin -- "$out")
          flask plugins prune "$out"  # minus what .releaseignore lists
          key="$RUNNER_TEMP/key.pem"
          (umask 077 && printf '%s\n' "$SIGNING_KEY" > "$key")
          flask plugins sign "$out" --key "$key" --signer "${{ vars.HUBRA_SIGNER || 'Hubra' }}"
          rm -f "$key"
          flask plugins pack "$out" -o "$GITHUB_WORKSPACE/$ID-$VER.zip"

      - name: Release notes from CHANGELOG.md
        if: github.event_name == 'release'
        env:
          BODY: ${{ github.event.release.body }}
        run: |
          python3 - <<'PY'
          import os, re
          v = os.environ["VER"]
          log = open("plugin/CHANGELOG.md").read() if os.path.exists("plugin/CHANGELOG.md") else ""
          m = re.search(rf"^##+\s*\[?v?{re.escape(v)}\]?\b[^\n]*\n(.*?)(?=^##+\s|\Z)", log, re.M | re.S)
          section = m.group(1).strip() if m else ""
          body = os.environ.get("BODY", "").strip()
          parts = [body] if body else []
          if section and section not in body:
              parts.append(f"## Changes in {v}\n\n{section}" if body else section)
          open("notes.md", "w").write("\n\n".join(parts) or f"{os.environ['ID']} {v}")
          PY

      - name: Attach the signed plugin to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" "$ID-$VER.zip" --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --notes-file notes.md --repo "$GITHUB_REPOSITORY"

      - name: Tell the Marketplace
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.MARKETPLACE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "No MARKETPLACE_TOKEN: the Marketplace picks it up on its next hourly run."; exit 0; fi
          gh api "repos/${{ vars.MARKETPLACE_REPO || 'hubra-app/hubra-plugins' }}/dispatches" -f event_type=plugin-released
